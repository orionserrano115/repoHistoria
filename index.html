<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historia del Fútbol</title>
  <style>
    :root {
      --bg: #f2f2f2;
      --text: #222;
      --card: #ffffff;
      --primary: #27ae60;
    }

    body.dark {
      --bg: #121212;
      --text: #f2f2f2;
      --card: #1e1e1e;
      --primary: #2ecc71;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      transition: all 0.4s ease;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.2rem;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    button:hover {
      transform: scale(1.05);
    }

    .timeline {
      display: grid;
      gap: 20px;
    }

    .event-card {
      background: var(--card);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      animation: fadeIn 0.5s ease;
      transition: transform 0.3s ease;
    }

    .event-card:hover {
      transform: translateY(-5px);
    }

    .event-card h2 {
      color: var(--primary);
      margin-bottom: 10px;
    }

    .form-section {
      margin-top: 40px;
      background: var(--card);
      padding: 20px;
      border-radius: 15px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Historia del Fútbol</h1>
    <button id="toggleTheme">Modo Oscuro</button>
  </header>

  <section class="timeline" id="timeline"></section>

  <section class="form-section">
    <h2>Agregar Evento Histórico</h2>
    <input type="text" id="year" placeholder="Año o época">
    <input type="text" id="title" placeholder="Título del evento">
    <textarea id="description" placeholder="Descripción"></textarea>
    <button id="addEvent">Agregar</button>
  </section>

  <script>
    const defaultEvents = [
      {
        year: "Siglo III a.C.",
        title: "Cuju en China",
        description: "Uno de los primeros juegos similares al fútbol registrado en la historia."
      },
      {
        year: "1863",
        title: "Fundación de la Football Association",
        description: "Se establecen las primeras reglas oficiales del fútbol moderno en Inglaterra."
      },
      {
        year: "1904",
        title: "Creación de la FIFA",
        description: "Nace el organismo rector internacional del fútbol."
      },
      {
        year: "1930",
        title: "Primer Mundial",
        description: "Uruguay organiza y gana la primera Copa Mundial de la FIFA."
      },
      {
        year: "1950-2000",
        title: "Globalización del fútbol",
        description: "El fútbol se convierte en el deporte más popular del planeta."
      },
      {
        year: "Actualidad",
        title: "Era moderna",
        description: "VAR, ligas multimillonarias, eSports y expansión digital."
      }
    ];

    let footballHistory = JSON.parse(localStorage.getItem("footballHistory")) || defaultEvents;

    const timeline = document.getElementById("timeline");

    function renderTimeline() {
      timeline.innerHTML = "";
      footballHistory.forEach(event => {
        const card = document.createElement("div");
        card.classList.add("event-card");
        card.innerHTML = `
          <h2>${event.year} - ${event.title}</h2>
          <p>${event.description}</p>
        `;
        timeline.appendChild(card);
      });
    }

    document.getElementById("addEvent").addEventListener("click", () => {
      const year = document.getElementById("year").value;
      const title = document.getElementById("title").value;
      const description = document.getElementById("description").value;

      if (year && title && description) {
        footballHistory.push({ year, title, description });
        localStorage.setItem("footballHistory", JSON.stringify(footballHistory));
        renderTimeline();

        document.getElementById("year").value = "";
        document.getElementById("title").value = "";
        document.getElementById("description").value = "";
      }
    });

    document.getElementById("toggleTheme").addEventListener("click", () => {
      document.body.classList.toggle("dark");
    });

    renderTimeline();
  </script>

</body>
</html>
