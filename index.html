<style>
  :root {
    --bg: rgba(10, 20, 10, 0.85);
    --text: #ffffff;
    --card: rgba(0, 0, 0, 0.75);
    --primary: #39ff14;
    --neon: #00ff99;
  }

  body.dark {
    --bg: rgba(0, 0, 0, 0.9);
    --text: #f2f2f2;
    --card: rgba(15, 15, 15, 0.85);
    --primary: #39ff14;
    --neon: #00ffcc;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }

  body {
    background-color: #021402;

    /* Fondo con balones visibles */
    background-image:
      linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
      url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=1400&auto=format&fit=crop');

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    color: var(--text);
    padding: 20px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* EFECTO NEON GENERAL */
  .overlay {
    background: var(--bg);
    border: 2px solid var(--primary);
    border-radius: 20px;
    padding: 25px;
    backdrop-filter: blur(4px);

    box-shadow:
      0 0 10px var(--primary),
      0 0 25px var(--primary),
      0 0 50px rgba(57, 255, 20, 0.5);

    animation: glow 3s infinite alternate;
  }

  @keyframes glow {
    from {
      box-shadow:
        0 0 10px var(--primary),
        0 0 20px var(--primary);
    }

    to {
      box-shadow:
        0 0 20px var(--neon),
        0 0 40px var(--neon),
        0 0 70px var(--neon);
    }
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
  }

  h1 {
    font-size: 2.8rem;
    color: var(--primary);

    text-shadow:
      0 0 5px var(--primary),
      0 0 10px var(--primary),
      0 0 20px var(--neon),
      0 0 40px var(--neon);
  }

  button {
    background: transparent;
    color: white;
    border: 2px solid var(--primary);
    padding: 12px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;

    box-shadow:
      0 0 10px var(--primary),
      0 0 20px var(--primary);
  }

  button:hover {
    transform: scale(1.08);

    background: var(--primary);
    color: black;

    box-shadow:
      0 0 20px var(--primary),
      0 0 40px var(--primary),
      0 0 60px var(--neon);
  }

  .timeline {
    display: grid;
    gap: 25px;
  }

  .event-card {
    background: var(--card);
    padding: 20px;
    border-radius: 18px;

    border-left: 5px solid var(--primary);

    box-shadow:
      0 0 10px rgba(57, 255, 20, 0.5),
      0 0 25px rgba(57, 255, 20, 0.3);

    transition: 0.4s;
    animation: fadeIn 0.8s ease;
  }

  .event-card:hover {
    transform: translateY(-8px) scale(1.02);

    box-shadow:
      0 0 20px var(--primary),
      0 0 40px var(--primary),
      0 0 60px var(--neon);
  }

  .event-card h2 {
    color: var(--primary);
    margin-bottom: 10px;

    text-shadow:
      0 0 5px var(--primary),
      0 0 15px var(--primary);
  }

  .event-card p {
    line-height: 1.7;
  }

  .form-section {
    margin-top: 40px;
    background: var(--card);
    padding: 25px;
    border-radius: 18px;

    border: 2px solid var(--primary);

    box-shadow:
      0 0 20px rgba(57, 255, 20, 0.4);
  }

  input,
  textarea {
    width: 100%;
    padding: 14px;
    margin: 12px 0;

    border-radius: 10px;
    border: 2px solid #0f0;

    background: rgba(0, 0, 0, 0.7);
    color: white;

    transition: 0.3s;
  }

  input:focus,
  textarea:focus {
    outline: none;

    border-color: var(--primary);

    box-shadow:
      0 0 10px var(--primary),
      0 0 25px var(--primary);
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(20px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 768px) {
    header {
      flex-direction: column;
      gap: 15px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
    }
  }
</style>
